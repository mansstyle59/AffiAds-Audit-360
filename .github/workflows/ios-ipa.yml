name: Build iOS IPA for ESign / GBox

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Identifiant iOS de l’application (reverse-DNS)"
        required: true
        default: "fr.affiads.audit360"
        type: string

permissions:
  contents: read

concurrency:
  group: ios-ipa
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build unsigned IPA for ESign / GBox
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check bundle identifier
        env:
          IOS_BUNDLE_ID: ${{ inputs.bundle_id || 'fr.affiads.audit360' }}
        run: |
          set -euo pipefail
          if ! [[ "$IOS_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error::Bundle ID invalide. Exemple : fr.affiads.audit360"
            exit 1
          fi
          echo "IOS_BUNDLE_ID=$IOS_BUNDLE_ID" >> "$GITHUB_ENV"

      - name: Prepare local web app and Capacitor shell
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html www/
          cp -R assets www/assets
          cp manifest.webmanifest sw.js www/
          cat > package.json <<'JSON'
          {
            "name": "affiads-audit-360-ios",
            "version": "1.0.0",
            "private": true,
            "description": "iOS wrapper for AffiAds Audit 360",
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/ios": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3"
            }
          }
          JSON
          cat > capacitor.config.json <<JSON
          {
            "appId": "$IOS_BUNDLE_ID",
            "appName": "AffiAds Audit 360",
            "webDir": "www",
            "ios": { "contentInset": "automatic", "backgroundColor": "#ffffff" }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios

      - name: Build iOS app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA for signing in ESign / GBox
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App.app introuvable après compilation"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/AffiAds Audit 360.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $IOS_BUNDLE_ID" "$RUNNER_TEMP/ipa/Payload/AffiAds Audit 360.app/Info.plist"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/AffiAds-Audit-360-ESign-GBox.ipa" Payload)
          /usr/bin/unzip -l dist/AffiAds-Audit-360-ESign-GBox.ipa | grep -E 'Payload/[^/]+\.app/Info.plist$'
          echo "IPA créé : dist/AffiAds-Audit-360-ESign-GBox.ipa"
          echo "Ce fichier est non signé : il doit être signé dans ESign/GBox avec un certificat et un profil valides."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AffiAds-Audit-360-ESign-GBox-IPA
          path: dist/AffiAds-Audit-360-ESign-GBox.ipa
          if-no-files-found: error
          retention-days: 7
