name: Deploy AffiAds Audit 360 to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install SVG rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Generate crisp app icons
        run: |
          rsvg-convert -w 64 -h 64 assets/app-icon.svg -o assets/logo-64.png
          rsvg-convert -w 192 -h 192 assets/app-icon.svg -o assets/logo-192.png
          rsvg-convert -w 512 -h 512 assets/app-icon.svg -o assets/logo-512.png
          rsvg-convert -w 180 -h 180 assets/app-icon.svg -o assets/apple-touch-icon.png
          rsvg-convert -w 64 -h 64 assets/assistant-icon.svg -o assets/assistant-64.png
          rsvg-convert -w 192 -h 192 assets/assistant-icon.svg -o assets/assistant-192.png
      - name: Check JavaScript syntax
        run: node --check assets/app.js
      - name: Check Logo.dev integration syntax
        run: node --check assets/logo-dev.js
      - name: Test Logo.dev integration
        run: node --test tests/logo-dev.test.cjs
      - name: Test app, PWA, themes and asset consistency
        run: node --test tests/app-regression.test.cjs
      - name: Install Chromium smoke-test dependencies
        run: |
          npm install --prefix /tmp/affiads-e2e --no-save playwright@1.55.0
          /tmp/affiads-e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Test mobile browser flows
        env:
          NODE_PATH: /tmp/affiads-e2e/node_modules
        run: node --test tests/browser-smoke.test.cjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
